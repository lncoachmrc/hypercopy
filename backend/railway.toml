[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/backend/app/api/**", "/backend/app/core/**", "/backend/app/db/**",
  "/backend/app/models/**", "/backend/app/schemas/**", "/backend/app/main.py",
  "/backend/app/services/audit.py", "/backend/app/services/entitlement.py",
  "/backend/app/services/metrics.py", "/backend/app/services/public_performance.py",
  "/backend/app/adapters/stripe_client.py",
  "/backend/alembic/**", "/backend/requirements.txt", "/backend/Dockerfile",
  "/backend/railway.toml"
]

[deploy]
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT} --proxy-headers'"
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/health/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 2
overlapSeconds = 20
drainingSeconds = 30
