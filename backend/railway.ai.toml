[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/backend/app/workers/ai_intelligence_worker.py",
  "/backend/app/services/ai_intelligence.py",
  "/backend/app/services/ai_mode.py",
  "/backend/app/services/ai_profit_exit.py",
  "/backend/app/services/ai_profit_exit_collector.py",
  "/backend/app/services/ai_profit_exit_decision.py",
  "/backend/app/services/ai_profit_exit_economics.py",
  "/backend/app/services/ai_profit_exit_mode.py",
  "/backend/app/services/master_source_identity.py",
  "/backend/app/services/networking.py",
  "/backend/app/services/execution_destination.py",
  "/backend/app/services/destination_switch.py",
  "/backend/app/services/queue.py",
  "/backend/app/services/reconcile.py",
  "/backend/app/services/strategy_intents.py",
  "/backend/app/adapters/hyperliquid.py",
  "/backend/app/adapters/ratelimit.py",
  "/backend/app/engine/sizing.py",
  "/backend/app/core/**", "/backend/app/db/**", "/backend/app/models/**",
  "/backend/alembic/**", "/backend/requirements.txt", "/backend/Dockerfile",
  "/backend/railway.ai.toml"
]

[deploy]
startCommand = "python -m app.workers.ai_intelligence_worker"
restartPolicyType = "ALWAYS"
numReplicas = 1
overlapSeconds = 10
drainingSeconds = 30
