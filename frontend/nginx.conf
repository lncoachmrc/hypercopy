server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://api.web3modal.org https://api.web3modal.com https://walletconnect.org https://walletconnect.com https://secure.walletconnect.com https://secure.walletconnect.org; font-src 'self' https://fonts.reown.com; connect-src 'self' https://rpc.walletconnect.com https://rpc.walletconnect.org https://relay.walletconnect.com https://relay.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://api.web3modal.com https://api.web3modal.org https://keys.walletconnect.com https://keys.walletconnect.org wss://www.walletlink.org https://cca-lite.coinbase.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Railway service IPs are ephemeral across deploys. A literal proxy_pass
    # hostname is resolved by nginx only at startup and can therefore pin a
    # dead API replica after the API redeploys. Resolve the upstream through the
    # container's own DNS server and keep the proxy target in a variable so
    # nginx refreshes DNS according to the resolver TTL.
    resolver ${DNS_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream ${API_PROXY_UPSTREAM};

    # Same-origin browser gateway. The browser only talks to the frontend
    # origin; nginx forwards API/WebSocket traffic server-side.
    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location = /config.js { add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public,max-age=31536000,immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
