name: Resolve PR39 merge

on:
  push:
    branches:
      - feature/per-user-hyperliquid-network
    paths:
      - .github/workflows/resolve-pr39-merge.yml

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-user-hyperliquid-network
          fetch-depth: 0

      - name: Merge current main and preserve both feature sets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          printf 'Merge rc=%s\nConflicts:\n%s\n' "$merge_rc" "$conflicts"

          allowed='backend/app/api/admin.py
          backend/app/services/reconcile.py
          backend/app/workers/execution_worker.py
          frontend/src/Admin.tsx
          frontend/src/Settings.tsx
          frontend/src/settings-state.css'

          if [ -n "$conflicts" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if ! printf '%s\n' "$allowed" | sed 's/^ *//' | grep -Fxq "$file"; then
                echo "Unexpected merge conflict: $file" >&2
                exit 1
              fi
              git checkout --ours -- "$file"
            done <<< "$conflicts"
          fi

          python - <<'PY'
          from pathlib import Path

          # backend/app/api/admin.py: preserve per-user routing and PR40 worker-completion tracking.
          p = Path('backend/app/api/admin.py')
          s = p.read_text()
          old_import = 'AuditLog, CopyJob, CopyState, CredentialStatus, RiskHalt, RiskProfile,'
          new_import = 'AuditLog, CopyJob, CopyState, CredentialStatus, JobState, RiskHalt, RiskProfile,'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif new_import not in s:
              raise SystemExit('admin.py: JobState import pattern not found')

          start_marker = "@router.post('/users/{user_id}/reconcile', dependencies=[Depends(require_csrf)])"
          end_marker = "\n\nasync def _flag("
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('admin.py: reconcile block markers not found')

          merged_reconcile = r'''@router.post('/users/{user_id}/reconcile', dependencies=[Depends(require_csrf)])
          async def queue_reconcile(user_id: uuid.UUID, body: AdminReconcile, actor: User = Depends(admin), db: AsyncSession = Depends(get_db)):
              target = await db.get(User, user_id)
              if not target:
                  raise HTTPException(404, 'User not found')
              network_state = await user_network_state(db, target.id)
              network = network_state.network

              existing = (await db.execute(
                  select(CopyJob).where(
                      CopyJob.user_id == target.id,
                      CopyJob.origin == 'ADMIN_RECONCILE',
                      CopyJob.created_at >= network_state.started_at,
                      CopyJob.state.in_([JobState.QUEUED, JobState.PROCESSING, JobState.RETRYING]),
                  ).order_by(CopyJob.created_at.desc()).limit(1)
              )).scalar_one_or_none()
              if existing:
                  await audit(
                      db,
                      action='ADMIN_RECONCILE_REUSED',
                      actor_id=actor.id,
                      subject_id=target.id,
                      reason=body.reason,
                      after={'job_id': str(existing.id), 'state': existing.state.value, 'follower_network': network},
                  )
                  await db.commit()
                  return {
                      'queued': True,
                      'job_id': str(existing.id),
                      'state': existing.state.value,
                      'network': network,
                      'stream_published': existing.enqueued_at is not None,
                      'reused': True,
                  }

              job = CopyJob(
                  user_id=target.id,
                  asset='__RECONCILE__',
                  origin='ADMIN_RECONCILE',
                  state=JobState.QUEUED,
                  correlation_id=uuid.uuid4().hex,
                  context={'reason': body.reason, 'master_network': settings.master_network, 'follower_network': network},
              )
              db.add(job)
              await db.flush()

              published = False
              try:
                  await publish_job(redis_client(), db, job)
                  published = True
              except Exception:
                  job.enqueued_at = None
                  log.warning(
                      'Immediate admin reconcile publish failed; durable repair will retry',
                      extra={'job_id': str(job.id), 'user_id': str(target.id), 'network': network},
                      exc_info=True,
                  )

              await audit(
                  db,
                  action='ADMIN_RECONCILE_REQUESTED',
                  actor_id=actor.id,
                  subject_id=target.id,
                  reason=body.reason,
                  after={'job_id': str(job.id), 'stream_published': published, 'follower_network': network},
              )
              await db.commit()
              return {
                  'queued': True,
                  'job_id': str(job.id),
                  'state': job.state.value,
                  'network': network,
                  'stream_published': published,
                  'reused': False,
              }


          def _reconcile_job_payload(job: CopyJob) -> dict:
              context = job.context or {}
              return {
                  'job_id': str(job.id),
                  'state': job.state.value,
                  'network': context.get('follower_network'),
                  'last_error': job.last_error,
                  'attempt_count': job.attempt_count,
                  'next_attempt_at': job.next_attempt_at,
                  'result': context.get('result'),
                  'stream_published': int(context.get('stream_published') or 0),
                  'completed_at': context.get('completed_at'),
              }


          @router.get('/users/{user_id}/reconcile/{job_id}')
          async def reconcile_status(user_id: uuid.UUID, job_id: uuid.UUID, actor: User = Depends(admin), db: AsyncSession = Depends(get_db)):
              job = await db.get(CopyJob, job_id)
              if not job or job.user_id != user_id or job.origin != 'ADMIN_RECONCILE':
                  raise HTTPException(404, 'Reconciliation job not found')
              return _reconcile_job_payload(job)
          '''
          # Remove indentation introduced by the workflow YAML heredoc content.
          import textwrap
          merged_reconcile = textwrap.dedent(merged_reconcile)
          s = s[:start] + merged_reconcile.rstrip() + s[end:]
          p.write_text(s)

          # backend/app/services/reconcile.py: preserve per-user network epoch and PR40 completion result metadata.
          p = Path('backend/app/services/reconcile.py')
          s = p.read_text()
          needle = "    db.add(run); await db.flush()\n    try:"
          if needle not in s:
              raise SystemExit('reconcile.py: run initialization pattern not found')
          s = s.replace(needle, "    db.add(run); await db.flush()\n    jobs_created = 0\n    try:", 1)
          old = "run.status = 'SKIPPED'; run.finished_at = datetime.now(UTC); await db.commit(); return {'status': 'SKIPPED'}"
          if old not in s:
              raise SystemExit('reconcile.py: skipped return pattern not found')
          s = s.replace(old, "run.status = 'SKIPPED'; run.finished_at = datetime.now(UTC); await db.commit(); return {'status': 'SKIPPED', 'jobs_created': 0}", 1)
          needle = "                context=context,\n            ))\n\n        db.add(EquitySnapshot("
          if needle not in s:
              raise SystemExit('reconcile.py: CopyJob insertion pattern not found')
          s = s.replace(needle, "                context=context,\n            ))\n            jobs_created += 1\n\n        db.add(EquitySnapshot(", 1)

          old_run = "        run.status = 'OK'; run.discrepancy_type = 'DRIFT' if discrepancies else 'NONE'; run.before = {'discrepancies': discrepancies}; run.after = {'network': network, 'equity': str(equity), 'free_margin': str(free_margin), 'unmanaged_margin': str(unmanaged_margin), 'fills_synced': synced_fills, 'account_mode': account_mode, 'liquidity_backoffs': liquidity_backoffs}; run.finished_at = datetime.now(UTC)"
          new_run = "        run.status = 'OK'; run.discrepancy_type = 'DRIFT' if discrepancies else 'NONE'; run.before = {'discrepancies': discrepancies}; run.after = {'network': network, 'equity': str(equity), 'free_margin': str(free_margin), 'unmanaged_margin': str(unmanaged_margin), 'fills_synced': synced_fills, 'account_mode': account_mode, 'liquidity_backoffs': liquidity_backoffs, 'jobs_created': jobs_created}; run.finished_at = datetime.now(UTC)"
          if old_run not in s:
              raise SystemExit('reconcile.py: run status pattern not found')
          s = s.replace(old_run, new_run, 1)

          old_audit = "        await audit(db, action='RECONCILIATION_COMPLETED', subject_id=user.id, after={'network': network, 'discrepancies': discrepancies, 'account_mode': account_mode, 'equity': str(equity), 'liquidity_backoffs': liquidity_backoffs})"
          new_audit = "        await audit(db, action='RECONCILIATION_COMPLETED', subject_id=user.id, after={'network': network, 'discrepancies': discrepancies, 'account_mode': account_mode, 'equity': str(equity), 'liquidity_backoffs': liquidity_backoffs, 'jobs_created': jobs_created})"
          if old_audit not in s:
              raise SystemExit('reconcile.py: audit pattern not found')
          s = s.replace(old_audit, new_audit, 1)

          old_return = "        return {'status': 'OK', 'network': network, 'discrepancies': discrepancies, 'equity': str(equity), 'account_mode': account_mode, 'liquidity_backoffs': liquidity_backoffs}"
          new_return = "        return {'status': 'OK', 'network': network, 'discrepancies': discrepancies, 'equity': str(equity), 'account_mode': account_mode, 'liquidity_backoffs': liquidity_backoffs, 'jobs_created': jobs_created}"
          if old_return not in s:
              raise SystemExit('reconcile.py: return pattern not found')
          s = s.replace(old_return, new_return, 1)
          p.write_text(s)

          # backend/app/workers/execution_worker.py: preserve per-user adapter selection and persist PR40 result/publish count.
          p = Path('backend/app/workers/execution_worker.py')
          s = p.read_text()
          old = '''            await reconcile_user(
                  db,follower_hl,user,
                  master_positions=mp,master_equity=me,mids=follower_mids,master_mids=master_mids,
                  master_configs=master_configs,
              )
              await repair_stream(self.redis,db)
          '''
          old = textwrap.dedent(old)
          # exact source is indented inside operation(); use direct literal replacement instead
          old = "            await reconcile_user(\n                db,follower_hl,user,\n                master_positions=mp,master_equity=me,mids=follower_mids,master_mids=master_mids,\n                master_configs=master_configs,\n            )\n            await repair_stream(self.redis,db)"
          new = "            result=await reconcile_user(\n                db,follower_hl,user,\n                master_positions=mp,master_equity=me,mids=follower_mids,master_mids=master_mids,\n                master_configs=master_configs,\n            )\n            published=await repair_stream(self.redis,db)\n            return result,published"
          if old not in s:
              raise SystemExit('execution_worker.py: operation pattern not found')
          s = s.replace(old, new, 1)

          old = "            await asyncio.wait_for(operation(), timeout=timeout)"
          if old not in s:
              raise SystemExit('execution_worker.py: wait_for pattern not found')
          s = s.replace(old, "            result,published=await asyncio.wait_for(operation(), timeout=timeout)", 1)

          old = "        await db.refresh(job)\n        job.state=JobState.DONE"
          new = "        await db.refresh(job)\n        job.context={\n            **(job.context or {}),\n            'result': result,\n            'stream_published': published,\n            'completed_at': datetime.now(UTC).isoformat(),\n        }\n        job.state=JobState.DONE"
          if old not in s:
              raise SystemExit('execution_worker.py: completion pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # frontend/src/Admin.tsx: retain per-user network UX and add PR40 worker-completion polling.
          p = Path('frontend/src/Admin.tsx')
          s = p.read_text()
          old = "type ReconcileResult={queued:boolean;job_id:string;state:string;network:string;stream_published:boolean};"
          new = "type ReconcileQueued={queued:boolean;job_id:string;state:string;network:string;stream_published:boolean;reused:boolean};\ntype ReconcileOutcome={status:string;network?:string;jobs_created:number;discrepancies?:unknown[];liquidity_backoffs?:unknown[]};\ntype ReconcileStatus={job_id:string;state:string;network:string|null;last_error:string|null;attempt_count:number;next_attempt_at:string|null;result:ReconcileOutcome|null;stream_published:number;completed_at:string|null};\nconst wait=(ms:number)=>new Promise(resolve=>window.setTimeout(resolve,ms));"
          if old not in s:
              raise SystemExit('Admin.tsx: ReconcileResult type pattern not found')
          s = s.replace(old, new, 1)

          old = ",[actionMsg,setActionMsg]=useState('');const load="
          new = ",[actionMsg,setActionMsg]=useState(''),[reconciling,setReconciling]=useState<string|null>(null);const load="
          if old not in s:
              raise SystemExit('Admin.tsx: state pattern not found')
          s = s.replace(old, new, 1)

          start = s.find("const reconcileUser=async(u:U)=>{")
          end = s.find(";useEffect(()=>", start)
          if start < 0 or end < 0:
              raise SystemExit('Admin.tsx: reconcileUser markers not found')
          replacement = "const waitForReconcile=async(u:U,jobId:string)=>{const deadline=Date.now()+ACTIVATION_TIMEOUT_MS;while(Date.now()<deadline){const status=await get<ReconcileStatus>(`/admin/users/${u.id}/reconcile/${jobId}`);if(status.state==='DONE')return status;if(['DEAD','SKIPPED'].includes(status.state))throw new Error(`Riconciliazione ${status.state}: ${status.last_error||'nessun dettaglio disponibile'}`);setActionMsg(`Riconciliazione ${u.execution_network.toUpperCase()} ${status.state.toLowerCase()} · tentativo ${status.attempt_count} · job ${jobId.slice(0,8)}${status.last_error?` · ${status.last_error}`:''}`);await wait(1000)}throw new Error(`La riconciliazione non si è conclusa entro ${Math.round(ACTIVATION_TIMEOUT_MS/1000)} secondi. Il job ${jobId.slice(0,8)} resta tracciato e il worker può completarlo.`)};const reconcileUser=async(u:U)=>{if(reconciling)return;setReconciling(u.id);setActionMsg(`Riconciliazione ${u.execution_network.toUpperCase()} in accodamento…`);try{const queued=await post<ReconcileQueued>(`/admin/users/${u.id}/reconcile`,{reason});setActionMsg(`Riconciliazione ${u.execution_network.toUpperCase()} ${queued.state.toLowerCase()} · job ${queued.job_id.slice(0,8)}${queued.reused?' già in corso':''}`);const done=await waitForReconcile(u,queued.job_id);const result=done.result;setActionMsg(`Riconciliazione ${u.execution_network.toUpperCase()} ${result?.status||done.state} completata · ${result?.jobs_created??0} job operativi creati · ${done.stream_published} pubblicati.`);await load()}catch(e){setActionMsg(e instanceof Error?e.message:'Errore riconciliazione')}finally{setReconciling(null)}}"
          s = s[:start] + replacement + s[end:]

          old = '<button onClick={()=>void reconcileUser(u)}>Riconcilia (non attiva)</button>'
          new = '<button disabled={reconciling!==null} onClick={()=>void reconcileUser(u)}>{reconciling===u.id?\'Riconciliazione…\':\'Riconcilia (mantiene stato)\'}</button>'
          if old not in s:
              raise SystemExit('Admin.tsx: reconcile button pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git add backend/app/api/admin.py \
                  backend/app/services/reconcile.py \
                  backend/app/workers/execution_worker.py \
                  frontend/src/Admin.tsx \
                  frontend/src/Settings.tsx \
                  frontend/src/settings-state.css

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'Unresolved conflicts remain:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git rm .github/workflows/resolve-pr39-merge.yml
          git diff --check
          python -m compileall -q backend/app
          git status --short
          git commit -m "Merge current main into per-user network branch"
          git push origin HEAD:feature/per-user-hyperliquid-network
