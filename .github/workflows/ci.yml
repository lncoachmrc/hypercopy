name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-tree:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_TREE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPOSITORY_TREE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/targeted_release_preflight.py
      - run: python scripts/generate_repository_tree.py --output REPOSITORY_TREE.generated.txt
      - run: |
          test -s REPOSITORY_TREE.generated.txt
          test "$(git rev-parse HEAD)" = "$REPOSITORY_TREE_SHA"
          git ls-files --error-unmatch \
            backend/app/adapters/hyperliquid.py \
            backend/app/services/execution.py \
            backend/app/services/reconcile.py \
            backend/app/workers/execution_worker.py \
            backend/app/workers/watcher.py
      - uses: actions/upload-artifact@v7
        with:
          name: repository-tree-${{ env.REPOSITORY_TREE_SHA }}
          path: REPOSITORY_TREE.generated.txt
          if-no-files-found: error
          retention-days: 30

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hypercopy
          POSTGRES_PASSWORD: hypercopy
          POSTGRES_DB: hypercopy_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hypercopy -d hypercopy_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://hypercopy:hypercopy@localhost:5432/hypercopy_ci
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      KEK_PROVIDER: env
      ENCRYPTION_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HYPERLIQUID_NETWORK: testnet
      HYPERLIQUID_MASTER_ADDRESS: 0x0000000000000000000000000000000000000000
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # Critical correctness lint only; formatting/style can evolve without
      # weakening undefined-name/syntax/import safety in the release gate.
      - run: ruff check app tests --select E9,F63,F7,F82
      # HF-010 gradual static typing gate. Keep the initial boundary aligned
      # with the audit's financial/exchange/credential critical modules; expand
      # coverage deliberately as adjacent modules become typed.
      - run: pyright --project pyrightconfig.json
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:wallet-login
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npm audit --audit-level=high

  # Authoritative repository secret scan. `gitleaks git` without custom
  # --log-opts scans all reachable history; keep fetch-depth 0 so it is present.
  # The targeted release preflight above is not a substitute for this gate.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/gitleaks-full-history.log"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose . 2>&1 | tee "$log_file"
          grep -Eq '[1-9][0-9]* commits scanned' "$log_file"
