name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hypercopy
          POSTGRES_PASSWORD: hypercopy
          POSTGRES_DB: hypercopy_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hypercopy -d hypercopy_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://hypercopy:hypercopy@localhost:5432/hypercopy_ci
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      KEK_PROVIDER: env
      ENCRYPTION_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HYPERLIQUID_NETWORK: testnet
      HYPERLIQUID_MASTER_ADDRESS: 0x0000000000000000000000000000000000000000
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # Critical correctness lint only; formatting/style can evolve without
      # weakening undefined-name/syntax/import safety in the release gate.
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
