name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-pr39-spec:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 39 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-user-hyperliquid-network
          fetch-depth: 0
      - name: Align SPEC and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          p = Path('SPEC.md')
          s = p.read_text()
          marker = '## Per-user Hyperliquid execution network (normative)'
          if marker not in s:
              section = r'''

## Per-user Hyperliquid execution network (normative)

Questa sezione governa la selezione della rete dell'account operativo e prevale su eventuali riferimenti legacy che descrivono la rete follower come una singola proprietà globale del deployment.

### Modello di rete

- La rete della strategia sorgente resta deployment-scoped tramite la configurazione master prevista dal runtime.
- Ogni utente possiede `execution_network`, con valori ammessi `testnet` o `mainnet`, e `network_started_at` che delimita l'epoch operativa corrente.
- `testnet` è il default fail-safe per utenti esistenti e nuovi salvo una scelta esplicita dell'utente.
- Worker, riconciliazione, leverage, diagnostica, metriche operative e fan-out devono selezionare l'adapter Hyperliquid usando la rete persistita dell'utente, non una rete follower globale.

### Cambio TESTNET / MAINNET

La pagina Configurazione espone un toggle TESTNET / MAINNET. Il cambio rete è consentito quando sono contemporaneamente vere queste condizioni:

1. strategia utente in `PAUSED`;
2. nessuna posizione TRAXION gestita aperta;
3. nessun `CopyJob` `QUEUED`, `PROCESSING` o `RETRYING` nell'epoch corrente;
4. nessuna esecuzione `SUBMITTING` o `UNKNOWN` nell'epoch corrente.

Se una condizione manca, la UI mostra la checklist aggiornata e continua a verificare lo stato. Quando i requisiti sono soddisfatti il toggle diventa disponibile senza ulteriori passaggi manuali.

Al cambio rete TRAXION deve eseguire atomicamente o in una transazione coerente le seguenti operazioni:

- mantenere lo stato `PAUSED`;
- eliminare il `TradingAccount` operativo precedente e la relativa credenziale di signing;
- preservare storico esecuzioni, fill e audit;
- reinizializzare lo stato derivato che appartiene alla vecchia rete, incluso `PositionLedger` e `RiskState` quando previsto dall'implementazione;
- aggiornare `execution_network` e aprire una nuova `network_started_at` epoch;
- mostrare immediatamente la card di configurazione dell'API/Agent Wallet della nuova rete.

Prima del passaggio a MAINNET la UI deve mostrare un avvertimento esplicito che la rete utilizza fondi reali.

### API/Agent Wallet

TRAXION resta non-custodial. L'utente configura esclusivamente un API/Agent Wallet Hyperliquid dedicato e revocabile. Seed phrase e chiave privata del wallet principale non devono essere richieste, accettate, memorizzate o utilizzate. Dopo ogni cambio rete la nuova credenziale deve essere verificata sulla rete selezionata prima di qualsiasi attivazione della strategia.

### Gate di esecuzione MAINNET

La selezione `mainnet` configura la rete dell'utente ma non costituisce da sola autorizzazione a inviare ordini reali. Per l'esecuzione MAINNET devono continuare a essere soddisfatti i gate deterministici della piattaforma, inclusi almeno:

- `execution_network=mainnet` per l'utente;
- API/Agent Wallet MAINNET verificato;
- `ENABLE_LIVE_TRADING=true` nel deployment;
- flag PostgreSQL `live_trading=true` abilitato esplicitamente dal SUPERADMIN;
- entitlement, account e credenziale attivi;
- Risk Engine in stato normale e limiti rispettati;
- assenza di global pause, emergency stop o altri blocchi deterministici;
- in produzione, protezione delle credenziali secondo il provider KMS previsto dall'architettura.

Lo staging può esercitare il flusso di configurazione TESTNET / MAINNET mantenendo chiusi i gate che autorizzano ordini reali.

### Isolamento storico e riconciliazione

Dashboard, PnL, equity, diagnostica operativa, job pendenti ed esecuzioni ambigue devono essere valutati rispetto alla `network_started_at` epoch corrente quando il dato è network-specifico. La riconciliazione amministrativa mantiene il tracking fino al completamento del worker e non deve creare job duplicati già in corso nella stessa epoch.
'''
              p.write_text(s.rstrip() + section + '\n')
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/sync-pr39-spec.yml || true
          git add SPEC.md .github/workflows/ci.yml
          git diff --check
          git status --short
          git commit -m "Align SPEC and finalize per-user network branch"
          git push origin HEAD:feature/per-user-hyperliquid-network

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hypercopy
          POSTGRES_PASSWORD: hypercopy
          POSTGRES_DB: hypercopy_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hypercopy -d hypercopy_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://hypercopy:hypercopy@localhost:5432/hypercopy_ci
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      KEK_PROVIDER: env
      ENCRYPTION_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HYPERLIQUID_NETWORK: testnet
      HYPERLIQUID_MASTER_ADDRESS: 0x0000000000000000000000000000000000000000
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # Critical correctness lint only; formatting/style can evolve without
      # weakening undefined-name/syntax/import safety in the release gate.
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
