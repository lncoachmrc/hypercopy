name: Sync Reown branch with main

on:
  push:
    branches:
      - feature/reown-appkit-mobile-wallet-login
    paths:
      - .github/workflows/sync-reown-with-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reown-appkit-mobile-wallet-login
          fetch-depth: 0
      - name: Merge current main preserving Reown conflict hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X ours
      - name: Verify TESTNET MAINNET selector survived merge
        run: |
          grep -q "execution_network" frontend/src/Settings.tsx
          grep -q "MAINNET" frontend/src/Settings.tsx
          grep -q "network-switch" frontend/src/Settings.tsx
      - name: Remove one-shot workflow and push integration
        run: |
          git rm .github/workflows/sync-reown-with-main.yml
          git add -A
          git commit -m "Sync Reown staging branch with current main"
          git push origin HEAD:feature/reown-appkit-mobile-wallet-login
