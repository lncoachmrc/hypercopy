name: Reown lockfile verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/reown-lockfile.yml'

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: head
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline build
        working-directory: base/frontend
        run: |
          npm ci
          npm run build
          echo '=== BASELINE DIST ==='
          du -ah dist | sort -h | tail -n 30
      - name: Generate exact head lockfile
        working-directory: head/frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: reown-package-lock
          path: head/frontend/package-lock.json
          if-no-files-found: error
      - name: Install head dependencies
        working-directory: head/frontend
        run: npm ci
      - name: Typecheck head
        working-directory: head/frontend
        run: npm run typecheck
      - name: Build head and report bundle
        working-directory: head/frontend
        run: |
          npm run build
          echo '=== REOWN HEAD DIST ==='
          du -ah dist | sort -h | tail -n 40
      - name: Audit head dependencies
        working-directory: head/frontend
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        working-directory: head
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'Update frontend lockfile for Reown AppKit'
          git push origin HEAD:${{ github.head_ref }}
