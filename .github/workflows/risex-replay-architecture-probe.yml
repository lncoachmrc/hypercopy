name: RISEx replay architecture probe
on:
  push:
    branches:
      - feat/risex-2e-preparer-manual-entrypoint
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q 'eth-hash[pycryptodome]' eth-utils eth-abi requests
      - name: Read-only runtime selector and typehash probe
        run: |
          python - <<'PY'
          import json, requests
          from eth_utils import keccak
          from eth_abi import encode

          API='https://api.testnet.rise.trade'
          RPC='https://testnet.riselabs.xyz'
          SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'

          def get(path):
              r=requests.get(API+path,timeout=20); print('GET',path,r.status_code); r.raise_for_status(); return r.json()['data']
          rid=0
          def rpc(method,params):
              global rid
              rid+=1
              r=requests.post(RPC,json={'jsonrpc':'2.0','id':rid,'method':method,'params':params},timeout=20)
              r.raise_for_status(); p=r.json()
              if p.get('error'): raise RuntimeError(p['error'])
              return p['result']

          domain=get('/v1/auth/eip712-domain')
          system=get('/v1/system/config')
          auth=system['addresses']['auth']
          block=rpc('eth_blockNumber',[])
          slot=rpc('eth_getStorageAt',[auth,SLOT,block])
          impl='0x'+slot[-40:]
          code=rpc('eth_getCode',[impl,block])[2:].lower()
          print('AUTH',auth,'IMPL',impl,'BLOCK',block,'CODE_BYTES',len(code)//2)

          sigs=[
              'isNonceUsed(address,uint48,uint8)',
              'isNonceUsed(address,uint48,uint256)',
              'isNonceUsed(address,uint256,uint8)',
              'isNonceUsed(address,uint256,uint256)',
              'getNonceState(address)',
              'getNonceState(address,uint48)',
              'getNonceState(address,uint256)',
              'VERIFY_WITNESS_TYPEHASH()',
          ]
          for sig in sigs:
              selector=keccak(text=sig)[:4].hex()
              print('SELECTOR',sig,'0x'+selector,'PRESENT',selector in code)

          type_string='VerifyWitness(address account,address target,bytes32 hash,uint48 nonceAnchor,uint8 nonceBitmap,uint32 deadline)'
          typehash=keccak(text=type_string).hex()
          print('VERIFY_WITNESS_TYPEHASH','0x'+typehash,'PRESENT',typehash in code)

          zero='0x'+'00'*20
          candidates=[
              ('isNonceUsed(address,uint48,uint8)', ['address','uint48','uint8'], [zero,0,0]),
              ('isNonceUsed(address,uint48,uint256)', ['address','uint48','uint256'], [zero,0,0]),
              ('isNonceUsed(address,uint256,uint8)', ['address','uint256','uint8'], [zero,0,0]),
              ('isNonceUsed(address,uint256,uint256)', ['address','uint256','uint256'], [zero,0,0]),
              ('getNonceState(address)', ['address'], [zero]),
          ]
          for sig,types,vals in candidates:
              selector=keccak(text=sig)[:4]
              data='0x'+(selector+encode(types,vals)).hex()
              try:
                  result=rpc('eth_call',[{'to':auth,'data':data},block])
                  print('CALL',sig,'OK',result)
              except Exception as e:
                  print('CALL',sig,'ERR',str(e)[:240])
          PY
